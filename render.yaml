services:
  - type: web
    name: anki-pocket-tts-bot
    env: docker
    plan: free
    region: oregon
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: SECRET_TOKEN
        generateValue: true
      - key: DEFAULT_ENGINE
        value: edge-tts
      - key: DEFAULT_EDGE_VOICE
        value: pt-BR-FranciscaNeural
      - key: DEFAULT_SPEED
        value: 1.0x
